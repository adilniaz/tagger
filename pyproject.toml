[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tagger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "mutagen",
    "ebooklib",
    "pypdf",
]

[project.scripts]
tagger = "main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
