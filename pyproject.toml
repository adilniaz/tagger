[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tagger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.5",
    "mutagen>=1.45",
    "ebooklib>=0.18",
    "pypdf>=3.9",
]

[project.scripts]
tagger = "main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt"]
mobi = ["mobi"]

[tool.hatch.build.targets.wheel]
packages = ["core", "gui"]
include = ["main.py", "check_tags.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
